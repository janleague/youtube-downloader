name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: NEWGUI/react-src/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          cd NEWGUI/react-src
          npm ci

      - name: Test Python core
        run: python -m unittest discover -s tests -v

      - name: Build Tauri installer
        working-directory: NEWGUI/react-src
        run: npm run release:build

      - name: Prepare release files
        shell: pwsh
        run: |
          $installer = Get-ChildItem "NEWGUI/react-src/src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item $installer.FullName "release/YouTubeDownloader-Setup.exe"
          $hash = Get-FileHash "release/YouTubeDownloader-Setup.exe" -Algorithm SHA256
          "$($hash.Hash)  YouTubeDownloader-Setup.exe" | Set-Content -Encoding ascii "release/SHA256SUMS.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: YouTubeDownloader-Windows
          path: release/*

      - name: Attach files to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
