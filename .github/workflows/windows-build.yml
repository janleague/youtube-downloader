name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Compile check
        run: python -m compileall -q .

      - name: Build portable executable
        run: python -m PyInstaller --noconfirm --clean YouTubeDownloader.spec

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss'

      - name: Generate checksums
        shell: pwsh
        run: |
          $files = @(
            "dist/YouTubeDownloader.exe",
            "dist/YouTubeDownloader-Setup-v2.0.0.exe"
          )
          $lines = foreach ($file in $files) {
            $hash = Get-FileHash $file -Algorithm SHA256
            "$($hash.Hash)  $([IO.Path]::GetFileName($file))"
          }
          $lines | Set-Content -Encoding ascii dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: YouTubeDownloader-Windows
          path: |
            dist/YouTubeDownloader.exe
            dist/YouTubeDownloader-Setup-v2.0.0.exe
            dist/SHA256SUMS.txt

      - name: Attach files to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/YouTubeDownloader.exe
            dist/YouTubeDownloader-Setup-v2.0.0.exe
            dist/SHA256SUMS.txt
